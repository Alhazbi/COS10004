<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip-Flop Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 1rem;
        }

        select {
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: #764ba2;
        }

        .inputs-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .toggle-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            min-width: 80px;
        }

        .toggle-btn.off {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        .toggle-btn.on {
            background: linear-gradient(135deg, #28a745 0%, #38ef7d 100%);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .clock-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .clock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .clock-btn:active {
            transform: translateY(0);
        }

        .clock-btn.pulse {
            animation: pulse 0.3s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .reset-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #dc3545 0%, #bd2130 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }

        .state-display {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .output {
            flex: 1;
            text-align: center;
            padding: 30px;
            border-radius: 12px;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .output.high {
            background: linear-gradient(135deg, #28a745 0%, #38ef7d 100%);
            animation: glow 1s ease-in-out infinite alternate;
        }

        .output.low {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }

        @keyframes glow {
            from { box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4); }
            to { box-shadow: 0 5px 25px rgba(40, 167, 69, 0.8); }
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        canvas {
            border-radius: 8px;
        }

        .truth-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .truth-table th,
        .truth-table td {
            padding: 12px;
            text-align: center;
            border: 2px solid #667eea;
        }

        .truth-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        .truth-table tr:nth-child(even) {
            background: #f8f9fa;
        }

        .truth-table tr:hover {
            background: #e7f1ff;
        }

        .log-container {
            max-height: 300px;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }

        .log-entry {
            padding: 8px;
            margin-bottom: 5px;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
        }

        .log-entry.clock {
            border-left-color: #764ba2;
        }

        .log-entry.state-change {
            border-left-color: #28a745;
            font-weight: 600;
        }

        .description {
            background: #e7f1ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            line-height: 1.6;
            color: #333;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2rem;
            }

            .state-display {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Flip-Flop Visualizer</h1>
            <p class="subtitle">Interactive Digital Logic Memory Elements</p>
        </header>

        <div class="main-content">
            <!-- Control Panel -->
            <div class="card">
                <h2>Control Panel</h2>
                <div class="control-panel">
                    <div class="control-group">
                        <label for="flipflopType">Flip-Flop Type:</label>
                        <select id="flipflopType">
                            <option value="SR">SR (Set-Reset) Flip-Flop</option>
                            <option value="D">D (Data) Flip-Flop</option>
                            <option value="JK">JK Flip-Flop</option>
                            <option value="T">T (Toggle) Flip-Flop</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>Inputs:</label>
                        <div class="inputs-container" id="inputsContainer">
                            <!-- Dynamic inputs will be inserted here -->
                        </div>
                    </div>

                    <div class="control-group">
                        <button class="clock-btn" id="clockBtn">🕐 Clock Pulse</button>
                    </div>

                    <div class="control-group">
                        <button class="reset-btn" id="resetBtn">↻ Reset</button>
                    </div>
                </div>
            </div>

            <!-- State Display -->
            <div class="card">
                <h2>Current State</h2>
                <div class="state-display">
                    <div class="output low" id="outputQ">
                        <div>Q</div>
                        <div id="qValue">0</div>
                    </div>
                    <div class="output high" id="outputQBar">
                        <div>Q'</div>
                        <div id="qBarValue">1</div>
                    </div>
                </div>
                <div class="description" id="stateDescription">
                    Click the Clock Pulse button to trigger the flip-flop.
                </div>
            </div>

            <!-- Circuit Diagram -->
            <div class="card">
                <h2>Circuit Diagram</h2>
                <div class="canvas-container">
                    <canvas id="circuitCanvas" width="500" height="300"></canvas>
                </div>
            </div>

            <!-- Truth Table -->
            <div class="card">
                <h2>Truth Table</h2>
                <table class="truth-table" id="truthTable">
                    <!-- Dynamic truth table will be inserted here -->
                </table>
            </div>

            <!-- Operation Log -->
            <div class="card full-width">
                <h2>Operation Log</h2>
                <div class="log-container" id="logContainer">
                    <div class="log-entry">System initialized. Ready for operation.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class FlipFlopSimulator {
            constructor() {
                this.type = 'SR';
                this.Q = 0;
                this.inputs = { S: 0, R: 0 };
                this.canvas = document.getElementById('circuitCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.logCounter = 0;

                this.init();
            }

            init() {
                document.getElementById('flipflopType').addEventListener('change', (e) => {
                    this.changeType(e.target.value);
                });

                document.getElementById('clockBtn').addEventListener('click', () => {
                    this.clockPulse();
                });

                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.reset();
                });

                this.changeType('SR');
            }

            changeType(type) {
                this.type = type;
                this.Q = 0;

                // Set up inputs based on type
                switch(type) {
                    case 'SR':
                        this.inputs = { S: 0, R: 0 };
                        break;
                    case 'D':
                        this.inputs = { D: 0 };
                        break;
                    case 'JK':
                        this.inputs = { J: 0, K: 0 };
                        break;
                    case 'T':
                        this.inputs = { T: 0 };
                        break;
                }

                this.updateInputs();
                this.updateTruthTable();
                this.drawCircuit();
                this.updateDisplay();
                this.addLog(`Changed to ${this.getTypeName()} flip-flop`);
            }

            getTypeName() {
                const names = {
                    'SR': 'SR (Set-Reset)',
                    'D': 'D (Data)',
                    'JK': 'JK',
                    'T': 'T (Toggle)'
                };
                return names[this.type];
            }

            updateInputs() {
                const container = document.getElementById('inputsContainer');
                container.innerHTML = '';

                Object.keys(this.inputs).forEach(key => {
                    const inputGroup = document.createElement('div');
                    inputGroup.className = 'input-group';

                    const label = document.createElement('label');
                    label.textContent = key;

                    const button = document.createElement('button');
                    button.className = `toggle-btn ${this.inputs[key] ? 'on' : 'off'}`;
                    button.textContent = this.inputs[key];
                    button.addEventListener('click', () => {
                        this.toggleInput(key);
                    });
                    button.id = `input-${key}`;

                    inputGroup.appendChild(label);
                    inputGroup.appendChild(button);
                    container.appendChild(inputGroup);
                });
            }

            toggleInput(key) {
                this.inputs[key] = this.inputs[key] ? 0 : 1;
                const button = document.getElementById(`input-${key}`);
                button.textContent = this.inputs[key];
                button.className = `toggle-btn ${this.inputs[key] ? 'on' : 'off'}`;
                this.drawCircuit();
                this.addLog(`Input ${key} set to ${this.inputs[key]}`);
            }

            clockPulse() {
                const btn = document.getElementById('clockBtn');
                btn.classList.add('pulse');
                setTimeout(() => btn.classList.remove('pulse'), 300);

                const oldQ = this.Q;

                switch(this.type) {
                    case 'SR':
                        this.executeSR();
                        break;
                    case 'D':
                        this.executeD();
                        break;
                    case 'JK':
                        this.executeJK();
                        break;
                    case 'T':
                        this.executeT();
                        break;
                }

                this.updateDisplay();
                this.drawCircuit();

                if (oldQ !== this.Q) {
                    this.addLog(`State changed: Q = ${oldQ} → ${this.Q}`, 'state-change');
                } else {
                    this.addLog(`State unchanged: Q = ${this.Q}`, 'clock');
                }
            }

            executeSR() {
                const { S, R } = this.inputs;

                if (S === 1 && R === 0) {
                    this.Q = 1;  // Set
                } else if (S === 0 && R === 1) {
                    this.Q = 0;  // Reset
                } else if (S === 0 && R === 0) {
                    // Hold (no change)
                } else if (S === 1 && R === 1) {
                    // Invalid state - set to 0 with warning
                    this.Q = 0;
                    this.addLog('⚠️ Warning: Invalid SR state (S=1, R=1)');
                }
            }

            executeD() {
                const { D } = this.inputs;
                this.Q = D;  // Q follows D
            }

            executeJK() {
                const { J, K } = this.inputs;

                if (J === 0 && K === 0) {
                    // Hold (no change)
                } else if (J === 0 && K === 1) {
                    this.Q = 0;  // Reset
                } else if (J === 1 && K === 0) {
                    this.Q = 1;  // Set
                } else if (J === 1 && K === 1) {
                    this.Q = this.Q ? 0 : 1;  // Toggle
                }
            }

            executeT() {
                const { T } = this.inputs;

                if (T === 1) {
                    this.Q = this.Q ? 0 : 1;  // Toggle
                }
                // If T = 0, hold (no change)
            }

            updateDisplay() {
                const qValue = document.getElementById('qValue');
                const qBarValue = document.getElementById('qBarValue');
                const outputQ = document.getElementById('outputQ');
                const outputQBar = document.getElementById('outputQBar');
                const description = document.getElementById('stateDescription');

                qValue.textContent = this.Q;
                qBarValue.textContent = this.Q ? 0 : 1;

                outputQ.className = `output ${this.Q ? 'high' : 'low'}`;
                outputQBar.className = `output ${this.Q ? 'low' : 'high'}`;

                description.textContent = this.getDescription();
            }

            getDescription() {
                const descriptions = {
                    'SR': 'SR flip-flop: S=1 sets Q=1, R=1 resets Q=0. S=R=0 holds state. S=R=1 is invalid.',
                    'D': 'D flip-flop: Output Q follows input D on clock pulse. Simple and reliable.',
                    'JK': 'JK flip-flop: Like SR but J=K=1 toggles output instead of invalid state.',
                    'T': 'T flip-flop: When T=1, output toggles on clock pulse. When T=0, output holds.'
                };
                return descriptions[this.type];
            }

            updateTruthTable() {
                const table = document.getElementById('truthTable');
                const tables = {
                    'SR': {
                        headers: ['S', 'R', 'Q(t+1)', 'State'],
                        rows: [
                            ['0', '0', 'Q(t)', 'Hold'],
                            ['0', '1', '0', 'Reset'],
                            ['1', '0', '1', 'Set'],
                            ['1', '1', '×', 'Invalid']
                        ]
                    },
                    'D': {
                        headers: ['D', 'Q(t+1)', 'State'],
                        rows: [
                            ['0', '0', 'Reset'],
                            ['1', '1', 'Set']
                        ]
                    },
                    'JK': {
                        headers: ['J', 'K', 'Q(t+1)', 'State'],
                        rows: [
                            ['0', '0', 'Q(t)', 'Hold'],
                            ['0', '1', '0', 'Reset'],
                            ['1', '0', '1', 'Set'],
                            ['1', '1', 'Q\'(t)', 'Toggle']
                        ]
                    },
                    'T': {
                        headers: ['T', 'Q(t+1)', 'State'],
                        rows: [
                            ['0', 'Q(t)', 'Hold'],
                            ['1', 'Q\'(t)', 'Toggle']
                        ]
                    }
                };

                const data = tables[this.type];
                let html = '<thead><tr>';
                data.headers.forEach(h => html += `<th>${h}</th>`);
                html += '</tr></thead><tbody>';
                data.rows.forEach(row => {
                    html += '<tr>';
                    row.forEach(cell => html += `<td>${cell}</td>`);
                    html += '</tr>';
                });
                html += '</tbody>';
                table.innerHTML = html;
            }

            drawCircuit() {
                const ctx = this.ctx;
                const canvas = this.canvas;

                // Clear canvas
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                switch(this.type) {
                    case 'SR':
                        this.drawSRCircuit();
                        break;
                    case 'D':
                        this.drawDCircuit();
                        break;
                    case 'JK':
                        this.drawJKCircuit();
                        break;
                    case 'T':
                        this.drawTCircuit();
                        break;
                }
            }

            drawSRCircuit() {
                const ctx = this.ctx;

                // Draw main flip-flop box
                ctx.fillStyle = '#f8f9fa';
                ctx.strokeStyle = '#667eea';
                ctx.lineWidth = 3;
                ctx.fillRect(180, 80, 140, 140);
                ctx.strokeRect(180, 80, 140, 140);

                // Label
                ctx.fillStyle = '#667eea';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('SR', 250, 160);
                ctx.font = '16px Arial';
                ctx.fillText('Flip-Flop', 250, 180);

                // S input
                this.drawInput(ctx, 80, 110, 'S', this.inputs.S);
                this.drawWire(ctx, 140, 110, 180, 110, this.inputs.S);

                // R input
                this.drawInput(ctx, 80, 170, 'R', this.inputs.R);
                this.drawWire(ctx, 140, 170, 180, 170, this.inputs.R);

                // Q output
                this.drawOutput(ctx, 370, 120, 'Q', this.Q);
                this.drawWire(ctx, 320, 120, 370, 120, this.Q);

                // Q' output
                this.drawOutput(ctx, 370, 160, "Q'", this.Q ? 0 : 1);
                this.drawWire(ctx, 320, 160, 370, 160, this.Q ? 0 : 1);
            }

            drawDCircuit() {
                const ctx = this.ctx;

                // Draw main flip-flop box
                ctx.fillStyle = '#f8f9fa';
                ctx.strokeStyle = '#667eea';
                ctx.lineWidth = 3;
                ctx.fillRect(180, 80, 140, 140);
                ctx.strokeRect(180, 80, 140, 140);

                // Label
                ctx.fillStyle = '#667eea';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('D', 250, 160);
                ctx.font = '16px Arial';
                ctx.fillText('Flip-Flop', 250, 180);

                // D input
                this.drawInput(ctx, 80, 140, 'D', this.inputs.D);
                this.drawWire(ctx, 140, 140, 180, 140, this.inputs.D);

                // Clock symbol
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(170, 195);
                ctx.lineTo(180, 205);
                ctx.lineTo(170, 215);
                ctx.stroke();

                // Q output
                this.drawOutput(ctx, 370, 120, 'Q', this.Q);
                this.drawWire(ctx, 320, 120, 370, 120, this.Q);

                // Q' output
                this.drawOutput(ctx, 370, 160, "Q'", this.Q ? 0 : 1);
                this.drawWire(ctx, 320, 160, 370, 160, this.Q ? 0 : 1);
            }

            drawJKCircuit() {
                const ctx = this.ctx;

                // Draw main flip-flop box
                ctx.fillStyle = '#f8f9fa';
                ctx.strokeStyle = '#667eea';
                ctx.lineWidth = 3;
                ctx.fillRect(180, 80, 140, 140);
                ctx.strokeRect(180, 80, 140, 140);

                // Label
                ctx.fillStyle = '#667eea';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('JK', 250, 160);
                ctx.font = '16px Arial';
                ctx.fillText('Flip-Flop', 250, 180);

                // J input
                this.drawInput(ctx, 80, 110, 'J', this.inputs.J);
                this.drawWire(ctx, 140, 110, 180, 110, this.inputs.J);

                // K input
                this.drawInput(ctx, 80, 170, 'K', this.inputs.K);
                this.drawWire(ctx, 140, 170, 180, 170, this.inputs.K);

                // Clock symbol
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(170, 195);
                ctx.lineTo(180, 205);
                ctx.lineTo(170, 215);
                ctx.stroke();

                // Q output
                this.drawOutput(ctx, 370, 120, 'Q', this.Q);
                this.drawWire(ctx, 320, 120, 370, 120, this.Q);

                // Q' output
                this.drawOutput(ctx, 370, 160, "Q'", this.Q ? 0 : 1);
                this.drawWire(ctx, 320, 160, 370, 160, this.Q ? 0 : 1);
            }

            drawTCircuit() {
                const ctx = this.ctx;

                // Draw main flip-flop box
                ctx.fillStyle = '#f8f9fa';
                ctx.strokeStyle = '#667eea';
                ctx.lineWidth = 3;
                ctx.fillRect(180, 80, 140, 140);
                ctx.strokeRect(180, 80, 140, 140);

                // Label
                ctx.fillStyle = '#667eea';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('T', 250, 160);
                ctx.font = '16px Arial';
                ctx.fillText('Flip-Flop', 250, 180);

                // T input
                this.drawInput(ctx, 80, 140, 'T', this.inputs.T);
                this.drawWire(ctx, 140, 140, 180, 140, this.inputs.T);

                // Clock symbol
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(170, 195);
                ctx.lineTo(180, 205);
                ctx.lineTo(170, 215);
                ctx.stroke();

                // Q output
                this.drawOutput(ctx, 370, 120, 'Q', this.Q);
                this.drawWire(ctx, 320, 120, 370, 120, this.Q);

                // Q' output
                this.drawOutput(ctx, 370, 160, "Q'", this.Q ? 0 : 1);
                this.drawWire(ctx, 320, 160, 370, 160, this.Q ? 0 : 1);
            }

            drawInput(ctx, x, y, label, value) {
                ctx.fillStyle = value ? '#28a745' : '#6c757d';
                ctx.fillRect(x, y - 15, 60, 30);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y - 15, 60, 30);

                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${label}=${value}`, x + 30, y + 5);
            }

            drawOutput(ctx, x, y, label, value) {
                ctx.fillStyle = value ? '#28a745' : '#6c757d';
                ctx.beginPath();
                ctx.arc(x + 20, y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = 'white';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(label, x + 20, y - 25);
                ctx.fillText(value, x + 20, y + 5);
            }

            drawWire(ctx, x1, y1, x2, y2, active) {
                ctx.strokeStyle = active ? '#28a745' : '#6c757d';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();

                if (active) {
                    // Draw electron flow animation (static representation)
                    ctx.fillStyle = '#fff';
                    const midX = (x1 + x2) / 2;
                    const midY = (y1 + y2) / 2;
                    ctx.beginPath();
                    ctx.arc(midX, midY, 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            addLog(message, type = '') {
                const logContainer = document.getElementById('logContainer');
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                const timestamp = new Date().toLocaleTimeString();
                entry.textContent = `[${timestamp}] ${message}`;
                logContainer.insertBefore(entry, logContainer.firstChild);

                // Keep only last 50 entries
                while (logContainer.children.length > 50) {
                    logContainer.removeChild(logContainer.lastChild);
                }
            }

            reset() {
                this.Q = 0;
                Object.keys(this.inputs).forEach(key => this.inputs[key] = 0);
                this.updateInputs();
                this.updateDisplay();
                this.drawCircuit();
                this.addLog('System reset to initial state');
            }
        }

        // Initialize the simulator
        const simulator = new FlipFlopSimulator();
    </script>
</body>
</html>
