<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-to-1 MUX: Building from Basic Gates - Interactive Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 1400px;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .canvas-container {
            background: #0a0e27;
            border-radius: 15px;
            padding: 20px;
            position: relative;
            min-height: 600px;
        }

        #mainCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border-left: 5px solid #667eea;
        }

        .step-info h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .step-info p {
            color: #333;
            line-height: 1.6;
            font-size: 1.05em;
        }

        .controls-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        .controls-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .input-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .input-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
        }

        .input-control:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .input-control.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }

        .input-control label {
            font-weight: 600;
            font-size: 1.1em;
            cursor: pointer;
        }

        .toggle-value {
            font-size: 1.5em;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.05em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            border-top: 2px solid #e9ecef;
        }

        .nav-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .nav-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .step-counter {
            text-align: center;
            font-size: 1.1em;
            color: #667eea;
            font-weight: 600;
        }

        .equation-box {
            background: #2a2d3a;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 1.1em;
            text-align: center;
            margin-top: 15px;
        }

        .highlight {
            color: #ffd700;
            font-weight: bold;
        }

        @media (max-width: 1200px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Building a 2-to-1 Multiplexer from Basic Gates</h1>
            <p>Watch how the selector bit controls the data flow path</p>
        </div>

        <div class="content-wrapper">
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
            </div>

            <div class="control-panel">
                <div class="step-info" id="stepInfo">
                    <h2 id="stepTitle">Step 1: The Goal</h2>
                    <p id="stepDescription">We need a circuit that can select between two inputs...</p>
                </div>

                <div class="controls-section">
                    <h3>Input Controls</h3>
                    <div class="input-controls">
                        <div class="input-control" id="controlI0">
                            <label>I₀ (Input 0)</label>
                            <span class="toggle-value" id="valueI0">1</span>
                        </div>
                        <div class="input-control active" id="controlI1">
                            <label>I₁ (Input 1)</label>
                            <span class="toggle-value" id="valueI1">1</span>
                        </div>
                        <div class="input-control" id="controlS">
                            <label>S (Selector)</label>
                            <span class="toggle-value" id="valueS">0</span>
                        </div>
                    </div>

                    <div class="equation-box" id="equationBox">
                        Y = (¬S · I₀) + (S · I₁)
                    </div>

                    <div class="button-group" style="margin-top: 20px;">
                        <button class="btn" id="btnAnimate">▶ Animate Signal Flow</button>
                        <button class="btn btn-secondary" id="btnReset">⟲ Reset Animation</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-btn" id="prevBtn">← Previous Step</button>
            <div class="step-counter">
                <span id="currentStep">1</span> / <span id="totalSteps">6</span>
            </div>
            <button class="nav-btn" id="nextBtn">Next Step →</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas size
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth - 40;
            canvas.height = 600;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // State
        const state = {
            I0: 1,
            I1: 1,
            S: 0,
            currentStep: 0,
            animating: false,
            particles: []
        };

        // Particle class for animated signals
        class Particle {
            constructor(path, color, speed = 2) {
                this.path = path;
                this.color = color;
                this.speed = speed;
                this.progress = 0;
                this.size = 8;
                this.alive = true;
            }

            update() {
                this.progress += this.speed / 100;
                if (this.progress >= 1) {
                    this.alive = false;
                }
            }

            draw(ctx) {
                if (!this.alive || this.progress < 0 || this.progress > 1) return;

                const point = this.getPointOnPath(this.progress);

                // Glow effect
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;

                // Main particle
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(point.x, point.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Inner bright spot
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(point.x, point.y, this.size / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            getPointOnPath(t) {
                if (this.path.length < 2) return this.path[0] || {x: 0, y: 0};

                const totalLength = this.path.length - 1;
                const segmentLength = 1 / totalLength;
                const segmentIndex = Math.min(Math.floor(t / segmentLength), totalLength - 1);
                const segmentT = (t - segmentIndex * segmentLength) / segmentLength;

                const p1 = this.path[segmentIndex];
                const p2 = this.path[segmentIndex + 1];

                return {
                    x: p1.x + (p2.x - p1.x) * segmentT,
                    y: p1.y + (p2.y - p1.y) * segmentT
                };
            }
        }

        // Steps configuration
        const steps = [
            {
                title: "Step 1: The Goal",
                description: "We need a circuit that selects between two inputs (I₀ and I₁) based on a selector bit S. When S=0, output Y should equal I₀. When S=1, Y should equal I₁.",
                draw: drawStep1
            },
            {
                title: "Step 2: Start with Input I₁",
                description: "Let's build the path for I₁ first. We need this input to reach the output ONLY when S=1. We'll use an AND gate: I₁ AND S.",
                draw: drawStep2
            },
            {
                title: "Step 3: Add the I₀ Path",
                description: "Now we need I₀ to reach output when S=0. First, we invert S using a NOT gate (¬S). Then we AND it with I₀: I₀ AND ¬S. This path is active only when S=0.",
                draw: drawStep3
            },
            {
                title: "Step 4: Combine with OR Gate",
                description: "Both AND gates output to an OR gate. Since only ONE path is active at a time (controlled by S), the OR gate simply passes through the active signal to Y.",
                draw: drawStep4
            },
            {
                title: "Step 5: How S Controls the Path",
                description: "Watch how flipping S from 0 to 1 switches which AND gate is active. The selector S acts like a switch, enabling one path while blocking the other. Toggle S to see the path change!",
                draw: drawStep5
            },
            {
                title: "Step 6: Complete 2-to-1 MUX",
                description: "This is a complete 2-to-1 Multiplexer! The formula Y = (¬S · I₀) + (S · I₁) shows how both paths combine. Click 'Animate Signal Flow' to watch data travel from inputs to output!",
                draw: drawStep6
            }
        ];

        // Drawing functions
        function drawWire(x1, y1, x2, y2, active = false, color = '#4a5568') {
            ctx.strokeStyle = active ? '#48bb78' : color;
            ctx.lineWidth = active ? 4 : 3;

            if (active) {
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#48bb78';
            }

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.shadowBlur = 0;
        }

        function drawInputNode(x, y, label, value, active = false) {
            // Circle
            ctx.fillStyle = active && value ? '#48bb78' : '#fff';
            ctx.strokeStyle = active && value ? '#48bb78' : '#667eea';
            ctx.lineWidth = 3;

            if (active && value) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#48bb78';
            }

            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Value
            ctx.fillStyle = active && value ? '#fff' : '#667eea';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(value.toString(), x, y);

            // Label
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '16px Arial';
            ctx.fillText(label, x - 50, y);
        }

        function drawOutputNode(x, y, value) {
            // Circle
            ctx.fillStyle = value ? '#48bb78' : '#fff';
            ctx.strokeStyle = value ? '#48bb78' : '#667eea';
            ctx.lineWidth = 3;

            if (value) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#48bb78';
            }

            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Value
            ctx.fillStyle = value ? '#fff' : '#667eea';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(value.toString(), x, y);

            // Label
            ctx.fillStyle = '#e2e8f0';
            ctx.font = '18px Arial';
            ctx.fillText('Y', x + 50, y);
        }

        function drawGate(x, y, type, active = false, label = '') {
            const width = 80;
            const height = 60;

            ctx.fillStyle = active ? '#ffd700' : '#fff';
            ctx.strokeStyle = active ? '#ffd700' : '#764ba2';
            ctx.lineWidth = 3;

            if (active) {
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffd700';
            }

            if (type === 'AND') {
                ctx.beginPath();
                ctx.moveTo(x, y - height/2);
                ctx.lineTo(x + width/2, y - height/2);
                ctx.arc(x + width/2, y, height/2, -Math.PI/2, Math.PI/2);
                ctx.lineTo(x, y + height/2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            } else if (type === 'OR') {
                ctx.beginPath();
                ctx.moveTo(x, y - height/2);
                ctx.quadraticCurveTo(x + width/3, y - height/2, x + width/2, y - height/3);
                ctx.quadraticCurveTo(x + width, y - height/4, x + width, y);
                ctx.quadraticCurveTo(x + width, y + height/4, x + width/2, y + height/3);
                ctx.quadraticCurveTo(x + width/3, y + height/2, x, y + height/2);
                ctx.quadraticCurveTo(x + width/4, y, x, y - height/2);
                ctx.fill();
                ctx.stroke();
            } else if (type === 'NOT') {
                ctx.beginPath();
                ctx.moveTo(x, y - 20);
                ctx.lineTo(x + 30, y);
                ctx.lineTo(x, y + 20);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Small circle for inversion
                ctx.beginPath();
                ctx.arc(x + 35, y, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.shadowBlur = 0;

            // Label
            ctx.fillStyle = active ? '#000' : '#764ba2';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(type, x + (type === 'NOT' ? 15 : width/2), y);

            if (label) {
                ctx.fillStyle = '#e2e8f0';
                ctx.font = '14px Arial';
                ctx.fillText(label, x + width/2, y - height/2 - 15);
            }
        }

        function drawStep1(ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Draw inputs
            drawInputNode(100, centerY - 80, 'I₀', state.I0);
            drawInputNode(100, centerY + 80, 'I₁', state.I1);

            // Draw selector
            drawInputNode(centerX, centerY + 180, 'S', state.S);

            // Draw question mark in center
            ctx.fillStyle = '#9ca3af';
            ctx.font = 'bold 60px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', centerX, centerY);

            // Draw output
            const outputVal = state.S ? state.I1 : state.I0;
            drawOutputNode(canvas.width - 100, centerY, outputVal);

            // Draw dashed lines
            ctx.setLineDash([10, 5]);
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(125, centerY - 80);
            ctx.lineTo(centerX - 50, centerY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(125, centerY + 80);
            ctx.lineTo(centerX - 50, centerY);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(centerX + 50, centerY);
            ctx.lineTo(canvas.width - 125, centerY);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function drawStep2(ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerY = canvas.height / 2;

            // Calculate if path is active
            const i1Active = state.I1 && state.S;

            // Draw I1 input
            drawInputNode(100, centerY + 60, 'I₁', state.I1, i1Active);

            // Draw S input
            drawInputNode(100, centerY + 140, 'S', state.S, state.S === 1);

            // Draw wires to AND gate
            drawWire(125, centerY + 60, 280, centerY + 80, i1Active);
            drawWire(125, centerY + 140, 280, centerY + 100, state.S === 1);

            // Draw AND gate
            drawGate(280, centerY + 90, 'AND', i1Active, 'I₁ · S');

            // Draw wire to output
            drawWire(360, centerY + 90, canvas.width - 125, centerY + 90, i1Active);

            // Draw output
            drawOutputNode(canvas.width - 100, centerY + 90, i1Active ? 1 : 0);

            // Highlight box
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.strokeRect(50, centerY + 20, canvas.width - 100, 180);
            ctx.setLineDash([]);
        }

        function drawStep3(ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerY = canvas.height / 2;

            // Calculate active paths
            const notS = !state.S;
            const i0Active = state.I0 && notS;
            const i1Active = state.I1 && state.S;

            // Draw I0 path (top)
            drawInputNode(100, centerY - 100, 'I₀', state.I0, i0Active);
            drawInputNode(100, centerY - 20, 'S', state.S, notS);

            // NOT gate for S
            drawWire(125, centerY - 20, 180, centerY - 20, notS);
            drawGate(180, centerY - 20, 'NOT', notS);

            // Wire from NOT to AND
            drawWire(220, centerY - 20, 280, centerY - 80, notS);
            drawWire(125, centerY - 100, 280, centerY - 100, i0Active);

            // AND gate for I0
            drawGate(280, centerY - 90, 'AND', i0Active, 'I₀ · ¬S');

            // Wire to output
            drawWire(360, centerY - 90, canvas.width - 125, centerY, i0Active);

            // Draw I1 path (bottom) - faded
            drawInputNode(100, centerY + 100, 'I₁', state.I1, i1Active);
            drawWire(125, centerY + 100, 280, centerY + 80, i1Active);
            drawWire(125, centerY - 20, 220, centerY - 20, state.S === 1);
            drawWire(220, centerY - 20, 220, centerY + 100, state.S === 1);
            drawWire(220, centerY + 100, 280, centerY + 100, state.S === 1);

            drawGate(280, centerY + 90, 'AND', i1Active, 'I₁ · S');
            drawWire(360, centerY + 90, canvas.width - 125, centerY, i1Active);

            // Output
            const outputVal = state.S ? (state.I1 ? 1 : 0) : (state.I0 ? 1 : 0);
            drawOutputNode(canvas.width - 100, centerY, outputVal);

            // Highlight I0 path
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.strokeRect(50, centerY - 140, canvas.width - 100, 180);
            ctx.setLineDash([]);
        }

        function drawStep4(ctx) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerY = canvas.height / 2;
            const andX = 280;
            const orX = 520;

            // Calculate active paths
            const notS = !state.S;
            const i0Active = state.I0 && notS;
            const i1Active = state.I1 && state.S;
            const outputActive = i0Active || i1Active;

            // I0 path
            drawInputNode(100, centerY - 100, 'I₀', state.I0, i0Active);
            drawInputNode(100, centerY - 20, 'S', state.S, notS);
            drawWire(125, centerY - 20, 180, centerY - 20, notS);
            drawGate(180, centerY - 20, 'NOT', notS);
            drawWire(220, centerY - 20, andX, centerY - 80, notS);
            drawWire(125, centerY - 100, andX, centerY - 100, i0Active);
            drawGate(andX, centerY - 90, 'AND', i0Active);

            // Wire from AND0 to OR
            drawWire(360, centerY - 90, orX, centerY - 20, i0Active);

            // I1 path
            drawInputNode(100, centerY + 100, 'I₁', state.I1, i1Active);
            drawWire(125, centerY + 100, andX, centerY + 80, i1Active);
            drawWire(125, centerY - 20, 220, centerY - 20, state.S === 1);
            drawWire(220, centerY - 20, 220, centerY + 100, state.S === 1);
            drawWire(220, centerY + 100, andX, centerY + 100, state.S === 1);
            drawGate(andX, centerY + 90, 'AND', i1Active);

            // Wire from AND1 to OR
            drawWire(360, centerY + 90, orX, centerY + 20, i1Active);

            // OR gate
            drawGate(orX, centerY, 'OR', outputActive);

            // Wire to output
            drawWire(600, centerY, canvas.width - 125, centerY, outputActive);

            // Output
            const outputVal = state.S ? (state.I1 ? 1 : 0) : (state.I0 ? 1 : 0);
            drawOutputNode(canvas.width - 100, centerY, outputVal);

            // Highlight OR gate
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 5]);
            ctx.strokeRect(orX - 30, centerY - 80, 140, 160);
            ctx.setLineDash([]);
        }

        function drawStep5(ctx) {
            drawCompleteCircuit(ctx, true); // with highlighting
        }

        function drawStep6(ctx) {
            drawCompleteCircuit(ctx, false);

            // Draw particles
            state.particles.forEach(particle => {
                particle.draw(ctx);
            });
        }

        function drawCompleteCircuit(ctx, highlight = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerY = canvas.height / 2;
            const andX = 320;
            const orX = 560;

            // Calculate active paths
            const notS = !state.S;
            const i0Active = state.I0 && notS;
            const i1Active = state.I1 && state.S;
            const outputActive = i0Active || i1Active;

            // I0 path
            drawInputNode(100, centerY - 100, 'I₀', state.I0, i0Active);
            drawWire(125, centerY - 100, andX, centerY - 100, i0Active);

            // S input and NOT gate
            drawInputNode(100, centerY + 200, 'S', state.S, true);
            drawWire(125, centerY + 200, 200, centerY + 200, true);

            // Split S signal
            drawWire(200, centerY + 200, 200, centerY - 50, notS);
            drawWire(200, centerY + 200, 200, centerY + 150, state.S === 1);

            // NOT gate
            drawWire(200, centerY - 50, 230, centerY - 50, notS);
            drawGate(230, centerY - 50, 'NOT', notS);
            drawWire(270, centerY - 50, andX, centerY - 80, notS);

            // AND gate for I0
            drawGate(andX, centerY - 90, 'AND', i0Active);
            drawWire(400, centerY - 90, orX, centerY - 20, i0Active);

            // I1 path
            drawInputNode(100, centerY + 100, 'I₁', state.I1, i1Active);
            drawWire(125, centerY + 100, andX, centerY + 80, i1Active);
            drawWire(200, centerY + 150, andX, centerY + 100, state.S === 1);

            // AND gate for I1
            drawGate(andX, centerY + 90, 'AND', i1Active);
            drawWire(400, centerY + 90, orX, centerY + 20, i1Active);

            // OR gate
            drawGate(orX, centerY, 'OR', outputActive);
            drawWire(640, centerY, canvas.width - 125, centerY, outputActive);

            // Output
            const outputVal = state.S ? (state.I1 ? 1 : 0) : (state.I0 ? 1 : 0);
            drawOutputNode(canvas.width - 100, centerY, outputVal);

            // Optional highlighting for step 5
            if (highlight) {
                const activeColor = state.S ? '#f5576c' : '#667eea';
                ctx.strokeStyle = activeColor;
                ctx.lineWidth = 4;
                ctx.setLineDash([10, 5]);

                if (state.S === 0 && i0Active) {
                    // Highlight I0 path
                    ctx.strokeRect(80, centerY - 130, 580, 180);
                } else if (state.S === 1 && i1Active) {
                    // Highlight I1 path
                    ctx.strokeRect(80, centerY + 50, 580, 180);
                }

                ctx.setLineDash([]);
            }
        }

        // Animation loop
        function animate() {
            if (state.currentStep === steps.length - 1) {
                // Update particles
                state.particles = state.particles.filter(p => {
                    p.update();
                    return p.alive;
                });
            }

            steps[state.currentStep].draw(ctx);
            requestAnimationFrame(animate);
        }

        // Start animation
        animate();

        // Create signal flow animation
        function createSignalFlow() {
            state.particles = [];
            const centerY = canvas.height / 2;
            const andX = 320;
            const orX = 560;

            if (state.S === 0 && state.I0) {
                // I0 path
                const path = [
                    {x: 125, y: centerY - 100},
                    {x: andX, y: centerY - 100},
                    {x: andX + 40, y: centerY - 90},
                    {x: orX, y: centerY - 20},
                    {x: orX + 40, y: centerY},
                    {x: canvas.width - 125, y: centerY}
                ];
                state.particles.push(new Particle(path, '#48bb78', 1.5));
            } else if (state.S === 1 && state.I1) {
                // I1 path
                const path = [
                    {x: 125, y: centerY + 100},
                    {x: andX, y: centerY + 80},
                    {x: andX + 40, y: centerY + 90},
                    {x: orX, y: centerY + 20},
                    {x: orX + 40, y: centerY},
                    {x: canvas.width - 125, y: centerY}
                ];
                state.particles.push(new Particle(path, '#48bb78', 1.5));
            }

            // Add continuous animation
            const interval = setInterval(() => {
                if (state.currentStep !== steps.length - 1 || !state.animating) {
                    clearInterval(interval);
                    return;
                }
                createSignalFlow();
            }, 1500);
        }

        // Event listeners
        document.getElementById('controlI0').addEventListener('click', () => {
            state.I0 = 1 - state.I0;
            document.getElementById('valueI0').textContent = state.I0;
            document.getElementById('controlI0').classList.toggle('active', state.I0 === 1);
        });

        document.getElementById('controlI1').addEventListener('click', () => {
            state.I1 = 1 - state.I1;
            document.getElementById('valueI1').textContent = state.I1;
            document.getElementById('controlI1').classList.toggle('active', state.I1 === 1);
        });

        document.getElementById('controlS').addEventListener('click', () => {
            state.S = 1 - state.S;
            document.getElementById('valueS').textContent = state.S;
            document.getElementById('controlS').classList.toggle('active', state.S === 1);
        });

        document.getElementById('btnAnimate').addEventListener('click', () => {
            if (state.currentStep === steps.length - 1) {
                state.animating = true;
                createSignalFlow();
            }
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            state.animating = false;
            state.particles = [];
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (state.currentStep > 0) {
                state.currentStep--;
                state.animating = false;
                state.particles = [];
                updateStep();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (state.currentStep < steps.length - 1) {
                state.currentStep++;
                updateStep();
            }
        });

        function updateStep() {
            const step = steps[state.currentStep];
            document.getElementById('stepTitle').textContent = step.title;
            document.getElementById('stepDescription').textContent = step.description;
            document.getElementById('currentStep').textContent = state.currentStep + 1;
            document.getElementById('totalSteps').textContent = steps.length;

            document.getElementById('prevBtn').disabled = state.currentStep === 0;
            document.getElementById('nextBtn').disabled = state.currentStep === steps.length - 1;

            // Enable animation button only on last step
            document.getElementById('btnAnimate').disabled = state.currentStep !== steps.length - 1;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' && state.currentStep < steps.length - 1) {
                state.currentStep++;
                updateStep();
            } else if (e.key === 'ArrowLeft' && state.currentStep > 0) {
                state.currentStep--;
                state.animating = false;
                state.particles = [];
                updateStep();
            } else if (e.key === ' ') {
                e.preventDefault();
                document.getElementById('btnAnimate').click();
            }
        });

        // Initialize
        updateStep();
    </script>
</body>
</html>
