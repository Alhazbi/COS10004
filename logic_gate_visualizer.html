<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Gate Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
        }

        select, button {
            padding: 12px 20px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        select {
            background: white;
        }

        button {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .circuit-container {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circuit-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        canvas {
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            max-width: 100%;
        }

        .switches {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .switch {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .switch-label {
            font-weight: 600;
            color: #555;
            font-size: 1.1em;
        }

        .toggle-switch {
            position: relative;
            width: 70px;
            height: 34px;
            cursor: pointer;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #4CAF50;
        }

        input:checked + .slider:before {
            transform: translateX(36px);
        }

        .truth-table {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: center;
            border: 2px solid #ddd;
            font-size: 1.1em;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
        }

        td {
            background: white;
        }

        .highlight-row {
            background: #90EE90 !important;
            font-weight: 600;
            animation: pulse 0.5s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .output-display {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            text-align: center;
            font-size: 1.3em;
            font-weight: 600;
        }

        .output-true {
            background: #90EE90;
            color: #2d5016;
        }

        .output-false {
            background: #ffcccb;
            color: #8b0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Logic Gate Visualizer ⚡</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="gateType">Gate Type:</label>
                <select id="gateType">
                    <option value="AND">AND</option>
                    <option value="OR">OR</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="numVariables">Number of Variables:</label>
                <select id="numVariables">
                    <option value="2">2 Variables</option>
                    <option value="3">3 Variables</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>&nbsp;</label>
                <button id="animateBtn">🎬 Animate All States</button>
            </div>
        </div>

        <div class="switches" id="switchesContainer"></div>

        <div class="main-content">
            <div class="circuit-container">
                <div class="circuit-title">Circuit Diagram</div>
                <canvas id="circuitCanvas" width="500" height="400"></canvas>
                <div class="output-display" id="outputDisplay">Output: 0</div>
            </div>

            <div class="truth-table">
                <div class="circuit-title">Truth Table</div>
                <table id="truthTable"></table>
            </div>
        </div>
    </div>

    <script>
        class LogicGateVisualizer {
            constructor() {
                this.canvas = document.getElementById('circuitCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gateType = 'AND';
                this.numVariables = 2;
                this.states = [false, false, false];
                this.animating = false;
                this.animationIndex = 0;
                
                this.init();
            }

            init() {
                document.getElementById('gateType').addEventListener('change', (e) => {
                    this.gateType = e.target.value;
                    this.update();
                });

                document.getElementById('numVariables').addEventListener('change', (e) => {
                    this.numVariables = parseInt(e.target.value);
                    this.states = [false, false, false];
                    this.createSwitches();
                    this.update();
                });

                document.getElementById('animateBtn').addEventListener('click', () => {
                    this.startAnimation();
                });

                this.createSwitches();
                this.update();
            }

            createSwitches() {
                const container = document.getElementById('switchesContainer');
                container.innerHTML = '';

                for (let i = 0; i < this.numVariables; i++) {
                    const switchDiv = document.createElement('div');
                    switchDiv.className = 'switch';
                    
                    const label = document.createElement('div');
                    label.className = 'switch-label';
                    label.textContent = String.fromCharCode(65 + i); // A, B, C
                    
                    const toggleLabel = document.createElement('label');
                    toggleLabel.className = 'toggle-switch';
                    
                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.id = `switch${i}`;
                    input.addEventListener('change', (e) => {
                        this.states[i] = e.target.checked;
                        this.update();
                    });
                    
                    const slider = document.createElement('span');
                    slider.className = 'slider';
                    
                    toggleLabel.appendChild(input);
                    toggleLabel.appendChild(slider);
                    switchDiv.appendChild(label);
                    switchDiv.appendChild(toggleLabel);
                    container.appendChild(switchDiv);
                }
            }

            calculateOutput() {
                const activeStates = this.states.slice(0, this.numVariables);
                
                if (this.gateType === 'AND') {
                    return activeStates.every(s => s);
                } else {
                    return activeStates.some(s => s);
                }
            }

            drawCircuit() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw battery
                ctx.fillStyle = '#FF6B6B';
                ctx.fillRect(30, 180, 20, 40);
                ctx.fillStyle = '#333';
                ctx.fillRect(30, 165, 20, 15);
                
                // Battery label
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.fillText('+', 25, 155);
                ctx.fillText('-', 25, 235);

                const output = this.calculateOutput();

                // Draw wires
                ctx.strokeStyle = output ? '#4CAF50' : '#999';
                ctx.lineWidth = 4;

                // Main power line
                ctx.beginPath();
                ctx.moveTo(50, 175);
                ctx.lineTo(100, 175);
                ctx.stroke();

                if (this.numVariables === 2) {
                    // Two switches in series for AND, parallel for OR
                    if (this.gateType === 'AND') {
                        // Series connection
                        this.drawSwitch(100, 175, this.states[0], 'A', 0);
                        
                        ctx.strokeStyle = this.states[0] ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(180, 175);
                        ctx.lineTo(230, 175);
                        ctx.stroke();

                        this.drawSwitch(230, 175, this.states[1], 'B', 1);
                        
                        ctx.strokeStyle = (this.states[0] && this.states[1]) ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(310, 175);
                        ctx.lineTo(360, 175);
                        ctx.stroke();
                    } else {
                        // Parallel connection
                        // Split
                        ctx.beginPath();
                        ctx.moveTo(100, 175);
                        ctx.lineTo(130, 175);
                        ctx.moveTo(130, 175);
                        ctx.lineTo(130, 125);
                        ctx.moveTo(130, 175);
                        ctx.lineTo(130, 225);
                        ctx.stroke();

                        // Upper branch
                        this.drawSwitch(130, 125, this.states[0], 'A', 0);
                        ctx.strokeStyle = this.states[0] ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(210, 125);
                        ctx.lineTo(330, 125);
                        ctx.stroke();

                        // Lower branch
                        this.drawSwitch(130, 225, this.states[1], 'B', 1);
                        ctx.strokeStyle = this.states[1] ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(210, 225);
                        ctx.lineTo(330, 225);
                        ctx.stroke();

                        // Merge
                        ctx.strokeStyle = output ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(330, 125);
                        ctx.lineTo(330, 175);
                        ctx.moveTo(330, 225);
                        ctx.lineTo(330, 175);
                        ctx.moveTo(330, 175);
                        ctx.lineTo(360, 175);
                        ctx.stroke();
                    }
                } else {
                    // Three switches
                    if (this.gateType === 'AND') {
                        // All in series
                        this.drawSwitch(100, 175, this.states[0], 'A', 0);
                        
                        ctx.strokeStyle = this.states[0] ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(180, 175);
                        ctx.lineTo(200, 175);
                        ctx.stroke();

                        this.drawSwitch(200, 175, this.states[1], 'B', 1);
                        
                        ctx.strokeStyle = (this.states[0] && this.states[1]) ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(280, 175);
                        ctx.lineTo(300, 175);
                        ctx.stroke();

                        this.drawSwitch(300, 175, this.states[2], 'C', 2);
                        
                        ctx.strokeStyle = (this.states[0] && this.states[1] && this.states[2]) ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(380, 175);
                        ctx.lineTo(420, 175);
                        ctx.stroke();
                    } else {
                        // All in parallel
                        ctx.beginPath();
                        ctx.moveTo(100, 175);
                        ctx.lineTo(130, 175);
                        ctx.moveTo(130, 175);
                        ctx.lineTo(130, 100);
                        ctx.moveTo(130, 175);
                        ctx.lineTo(130, 175);
                        ctx.moveTo(130, 175);
                        ctx.lineTo(130, 250);
                        ctx.stroke();

                        // Top branch
                        this.drawSwitch(130, 100, this.states[0], 'A', 0);
                        ctx.strokeStyle = this.states[0] ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(210, 100);
                        ctx.lineTo(330, 100);
                        ctx.stroke();

                        // Middle branch
                        this.drawSwitch(130, 175, this.states[1], 'B', 1);
                        ctx.strokeStyle = this.states[1] ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(210, 175);
                        ctx.lineTo(330, 175);
                        ctx.stroke();

                        // Bottom branch
                        this.drawSwitch(130, 250, this.states[2], 'C', 2);
                        ctx.strokeStyle = this.states[2] ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(210, 250);
                        ctx.lineTo(330, 250);
                        ctx.stroke();

                        // Merge
                        ctx.strokeStyle = output ? '#4CAF50' : '#999';
                        ctx.beginPath();
                        ctx.moveTo(330, 100);
                        ctx.lineTo(330, 175);
                        ctx.moveTo(330, 250);
                        ctx.lineTo(330, 175);
                        ctx.moveTo(330, 175);
                        ctx.lineTo(420, 175);
                        ctx.stroke();
                    }
                }

                // Draw bulb
                const bulbX = this.numVariables === 3 && this.gateType === 'AND' ? 420 : 420;
                this.drawBulb(bulbX, 140, output);

                // Complete circuit back to battery
                ctx.strokeStyle = output ? '#4CAF50' : '#999';
                ctx.beginPath();
                ctx.moveTo(bulbX, 175);
                ctx.lineTo(bulbX, 210);
                ctx.lineTo(50, 210);
                ctx.stroke();
            }

            drawSwitch(x, y, closed, label, index) {
                const ctx = this.ctx;
                
                // Switch base
                ctx.fillStyle = '#555';
                ctx.fillRect(x - 5, y - 15, 10, 30);
                ctx.fillRect(x + 75, y - 15, 10, 30);

                // Switch arm
                ctx.strokeStyle = closed ? '#4CAF50' : '#FF6B6B';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(x, y);
                if (closed) {
                    ctx.lineTo(x + 80, y);
                } else {
                    ctx.lineTo(x + 70, y - 20);
                }
                ctx.stroke();

                // Label
                ctx.fillStyle = '#000';
                ctx.font = 'bold 18px Arial';
                ctx.fillText(label, x + 30, y - 25);
            }

            drawBulb(x, y, on) {
                const ctx = this.ctx;
                
                // Bulb base
                ctx.fillStyle = '#8B7355';
                ctx.fillRect(x - 15, y + 35, 30, 15);

                // Bulb
                ctx.beginPath();
                ctx.arc(x, y, 35, 0, Math.PI * 2);
                
                if (on) {
                    // Glowing effect
                    const gradient = ctx.createRadialGradient(x, y, 10, x, y, 35);
                    gradient.addColorStop(0, '#FFFF00');
                    gradient.addColorStop(0.5, '#FFD700');
                    gradient.addColorStop(1, '#FFA500');
                    ctx.fillStyle = gradient;
                    
                    // Add glow halo
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#FFFF00';
                } else {
                    ctx.fillStyle = '#E0E0E0';
                    ctx.shadowBlur = 0;
                }
                
                ctx.fill();
                ctx.shadowBlur = 0;
                
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Filament
                if (on) {
                    ctx.strokeStyle = '#FF4500';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x - 10, y);
                    ctx.lineTo(x + 10, y);
                    ctx.stroke();
                }
            }

            generateTruthTable() {
                const table = document.getElementById('truthTable');
                let html = '<thead><tr>';
                
                // Headers
                for (let i = 0; i < this.numVariables; i++) {
                    html += `<th>${String.fromCharCode(65 + i)}</th>`;
                }
                html += `<th>${this.gateType}</th></tr></thead><tbody>`;

                // Rows
                const numRows = Math.pow(2, this.numVariables);
                for (let i = 0; i < numRows; i++) {
                    const rowStates = [];
                    for (let j = this.numVariables - 1; j >= 0; j--) {
                        rowStates.unshift((i >> j) & 1);
                    }

                    const output = this.gateType === 'AND' 
                        ? rowStates.every(s => s === 1)
                        : rowStates.some(s => s === 1);

                    // Check if this row matches current state
                    const isCurrentRow = rowStates.every((s, idx) => s === (this.states[idx] ? 1 : 0));
                    const rowClass = isCurrentRow ? 'highlight-row' : '';

                    html += `<tr class="${rowClass}">`;
                    rowStates.forEach(s => {
                        html += `<td>${s}</td>`;
                    });
                    html += `<td>${output ? 1 : 0}</td>`;
                    html += '</tr>';
                }

                html += '</tbody>';
                table.innerHTML = html;
            }

            updateOutput() {
                const output = this.calculateOutput();
                const display = document.getElementById('outputDisplay');
                display.textContent = `Output: ${output ? '1 (TRUE)' : '0 (FALSE)'}`;
                display.className = output ? 'output-display output-true' : 'output-display output-false';
            }

            update() {
                this.drawCircuit();
                this.generateTruthTable();
                this.updateOutput();
            }

            async startAnimation() {
                if (this.animating) return;
                
                this.animating = true;
                const btn = document.getElementById('animateBtn');
                btn.disabled = true;
                btn.textContent = '⏸️ Animating...';

                const numStates = Math.pow(2, this.numVariables);
                
                for (let i = 0; i < numStates; i++) {
                    for (let j = 0; j < this.numVariables; j++) {
                        this.states[j] = ((i >> (this.numVariables - 1 - j)) & 1) === 1;
                        document.getElementById(`switch${j}`).checked = this.states[j];
                    }
                    
                    this.update();
                    await new Promise(resolve => setTimeout(resolve, 1000));
                }

                this.animating = false;
                btn.disabled = false;
                btn.textContent = '🎬 Animate All States';
            }
        }

        // Initialize the visualizer
        window.addEventListener('load', () => {
            new LogicGateVisualizer();
        });
    </script>
</body>
</html>
